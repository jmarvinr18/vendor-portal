# Rendered by the nginx image's envsubst step (copied to /etc/nginx/templates), so
# ${API_UPSTREAM} comes from the container environment. nginx's own $variables are untouched.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # API calls stay same-origin for the browser; nginx forwards them to the Flask API.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Ten 10MB supporting documents per invoice.
    client_max_body_size 110m;
    proxy_read_timeout 300s;
  }

  # Hashed build assets can be cached indefinitely.
  # (add_header in a location replaces the server-level ones, so security headers repeat.)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # SPA fallback so client-side routes (e.g. /submit-invoice) work on refresh.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }
}
